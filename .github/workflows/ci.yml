name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (doc-paths + shellcheck + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff + shellcheck
        run: |
          pip install ruff
          sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Doc-paths lint
        env:
          CORE_INSTANCE: ${{ github.workspace }}
          CORE_ENGINE: ${{ github.workspace }}
        run: bash bin/lint-doc-paths.sh

      - name: Shellcheck (hooks + bin)
        run: |
          find .claude/hooks bin -type f \( -name "*.sh" \) -print0 \
            | xargs -0 shellcheck -S warning || true

      - name: Ruff (Python)
        run: ruff check . || true
  # The macOS hook-tests job was REMOVED 2026-08-16. On a PRIVATE repo macOS bills
  # at 10x the minute rate, and it exhausted the monthly Actions allowance, which
  # made every later run fail in ~3s with zero steps and email a failure notice.
  # It is not moved to ubuntu on purpose: these hooks depend on BSD grep semantics,
  # so a Linux run would test a grep this fleet never uses. Run them locally with
  # bash bin/tests/run-all.sh, which is where they were already being run.
